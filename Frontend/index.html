<!DOCTYPE html>
<html>

<head>
    <title>TODOong</title>
    <meta charset="UTF-8">
</head>

<body>
    <h1>ToDoong</h1>
    <form id="todo-form">
        <input id="todo-title" type="text" placeholder="Enter Todo..." required>
        <button id="add-todo-button" type="submit">Add</button>
    </form>
    <p id="message" role="status"></p>
    <p id="todo-count"></p>
    <ul id="todo-list"></ul>

    <script src="./script.js" defer></script>
</body>

</html>
